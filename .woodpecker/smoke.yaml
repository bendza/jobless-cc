# Non-deploy Woodpecker pilot. Run only trusted pushes; this public repository
# must not execute fork pull-request code on a persistent Docker agent.
when:
  - event: push
    branch: main

# Pin to the jobless agent (6 GiB / 2 CPU per step). Without labels any
# agent can take this workflow, including the 2 GiB sitetest agent.
labels:
  product: jobless

steps:
  - name: package-smoke
    image: node:22-bookworm-slim
    commands:
      - npm pack --dry-run
      - node bin/cli.cjs --version
      - node bin/cli.cjs --help
